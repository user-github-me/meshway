name: Disposable macOS full helper loopback
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source commit to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  full-helper-loopback:
    runs-on: macos-14
    timeout-minutes: 12
    env:
      MESHWAY_DISPOSABLE_MACOS_VM: '1'
      MESHWAY_TESTED_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Build production helper
        run: |
          mkdir -p .tools/macos-utun-lab
          go build -buildvcs=false -trimpath -o .tools/macos-utun-lab/meshway ./cmd/meshway
      - name: Actual full helper with local authenticated exit and DNS
        run: python3 scripts/macos-utun-loopback-lab.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-utun-loopback-runtime
          path: .tools/utun-loopback/result.json
          include-hidden-files: true
          if-no-files-found: warn
