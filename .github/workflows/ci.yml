name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout=180s
      - run: ./scripts/build.sh --all
      - run: go build ./cmd/meshway-net-lab
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.27.2'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: ./scripts/build.sh
      - run: ./apps/macos/build.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser --workspace @meshway/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/web/test-results
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: dotnet build apps/windows/Meshway/Meshway.csproj -c Release
      - run: go build -o dist/meshway-windows-amd64.exe ./cmd/meshway
      - run: python apps/windows/prepare-wintun.py --arch amd64 --output dist/wintun/amd64/wintun.dll
      - run: ./apps/windows/build.ps1 -Runtime win-x64 -Daemon dist/meshway-windows-amd64.exe -Wintun dist/wintun/amd64/wintun.dll
      - run: ./scripts/validate-windows.ps1 -Daemon dist/Meshway-win-x64/meshway-daemon.exe
      - run: ./scripts/windows-tun-lab.ps1 -Package dist/Meshway-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-evidence
          path: |
            artifacts/windows-validation.json
            artifacts/windows-wintun-validation.json
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: ./apps/android/build.sh
