name: publish-container
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag without v (including prerelease, e.g. 0.1.0-alpha.1)
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate destination and tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo 'An explicit semantic version is required.' >&2
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'version=%s\nimage=%s\n' "$version" "$image" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: go test -race ./... -count=1 -timeout=180s
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published manifest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION" | tee container-manifest.txt
      - name: Export portable container downloads
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p container-downloads
          for architecture in amd64 arm64; do
            docker pull --platform "linux/$architecture" "$IMAGE:$VERSION"
            docker tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-$architecture"
            docker run --rm --platform "linux/$architecture" "$IMAGE:$VERSION-$architecture" version
            docker save "$IMAGE:$VERSION-$architecture" | gzip > "container-downloads/meshway-container-linux-$architecture.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: portable-container-images
          path: container-downloads
      - uses: actions/upload-artifact@v4
        with:
          name: container-publication-evidence
          path: container-manifest.txt
