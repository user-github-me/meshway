name: draft-release
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Explicit owner/repository destination
        required: true
        type: string
      tag:
        description: Existing verified Git tag (vX.Y.Z)
        required: true
        type: string
      sequence:
        description: Monotonically increasing signing sequence
        required: true
        type: string
      expires:
        description: Signed metadata expiry (ISO UTC)
        required: true
        type: string
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: go test -race ./... -count=1 -timeout=180s
      - run: npm test
      - run: ./scripts/release.sh
      - name: Package reviewed source
        run: npm pack --workspace @meshway/cli --pack-destination release
      - name: Sign and independently verify artifacts
        env:
          RELEASE_PRIVATE_PEM: ${{ secrets.RELEASE_ED25519_PRIVATE_PEM }}
          RELEASE_PUBLIC_PEM: ${{ vars.RELEASE_ED25519_PUBLIC_PEM }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
          RELEASE_EXPIRES: ${{ inputs.expires }}
        run: |
          umask 077
          keyfile=$(mktemp)
          pubfile=$(mktemp)
          trap 'rm -f "$keyfile" "$pubfile"' EXIT
          printf '%s' "$RELEASE_PRIVATE_PEM" > "$keyfile"
          printf '%s' "$RELEASE_PUBLIC_PEM" > "$pubfile"
          node scripts/release-tool.mjs sign release "$keyfile" "${RELEASE_TAG#v}" "$RELEASE_SEQUENCE" "$RELEASE_EXPIRES"
          node scripts/release-tool.mjs verify release "$pubfile"
      - name: Upload verified draft to explicit repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ inputs.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PUBLIC_PEM: ${{ vars.RELEASE_ED25519_PUBLIC_PEM }}
        run: |
          test "$RELEASE_REPOSITORY" = "$GITHUB_REPOSITORY"
          pubfile=$(mktemp)
          trap 'rm -f "$pubfile"' EXIT
          printf '%s' "$RELEASE_PUBLIC_PEM" > "$pubfile"
          ./scripts/publish-release.sh "$RELEASE_REPOSITORY" "$RELEASE_TAG" release "$pubfile"
